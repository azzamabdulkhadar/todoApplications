<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="statsContainer">
            <div class="details">
                <h1>Todos</h1>
                <p>Keep it up</p>
                <div id="progressBar">
                    <div id="progress"></div>
                </div>
            </div>
            <div class="statsNumber">
                <div id="numbers">0/0</div>
            </div>
        </div>
        <form action="">
            <input id = "taskInput" type ="text" placeholder="Write you task">
            <button id= "newTask" type="submit">+</button>
        </form> 
        
        <ul id="taskList"></ul>
    </div>
    <!-- confetti.js.org (tsParticles build) - must load before script.js so window.confetti exists -->
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.3.2/tsparticles.confetti.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
